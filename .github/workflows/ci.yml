name: platform-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  composition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Check pinned component layout
        run: python3 scripts/workspace.py check
      - name: Check automation syntax
        run: |
          python3 -m py_compile scripts/workspace.py scripts/with-infisical.py
          for script in scripts/ci/*.sh scripts/security/*.sh .githooks/*; do bash -n "$script"; done
      - name: Scan complete published history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --log-opts=--all --config /repo/.gitleaks.toml --redact=100 --no-banner
